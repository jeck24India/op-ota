name: OTA Database Auto-Update

on:
  schedule:
    - cron: '0 0 */5 * *' # Runs every 5 days
  workflow_dispatch:      # Allows manual "Run" button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 🪛 CRITICAL FIX: Forces the Windows Python terminal log to output clean UTF-8 emojis
  PYTHONIOENCODING: utf-8

jobs:
  scrape_and_update:
    runs-on: windows-2025 
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 urllib3

      - name: Run Scraper
        run: python global.py 

      - name: Save JSON to Repo

        run: |

          git config --global user.name "OnePlus-Bot"

          git config --global user.email "bot@yourdomain.com"

          git add oneplus_ota_final.json

          git commit -m "Auto-update OTA JSON" || exit 0

          git push 

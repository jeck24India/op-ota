name: OTA Database Auto-Update

on:
  schedule:
    - cron: '0 0 */5 * *' # Runs every 5 days
  workflow_dispatch:      # Allows manual "Run" button

env:
  # Opt into Node 24 now to clear the GitHub Actions deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape_and_update:
    # Explicitly using windows-2025 to smoothly align with GitHub's upcoming June 15 migration
    runs-on: windows-2025 
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 urllib3

      - name: Run Scraper
        # IMPORTANT: Make sure this file matches your python file name exactly (e.g., global.py)
        run: python global.py 

      - name: Save JSON to Repo
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check for changes cleanly to prevent exit code 1 crashes on identical runs
          if git diff --quiet oneplus_ota_final.json; then
            echo "[+] No new firmware changes detected. Skipping push."
            exit 0
          else
            echo "[+] New firmware versions found! Committing changes..."
            git add oneplus_ota_final.json
            git commit -m "Auto-update OTA JSON: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

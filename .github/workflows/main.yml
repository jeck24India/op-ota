name: OTA Database Auto-Update

on:
  schedule:
    - cron: '0 0 */5 * *' # Runs every 5 days
  workflow_dispatch:      # Allows manual "Run" button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8

jobs:
  scrape_and_update:
    runs-on: windows-2025 
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # Fetches history so Git knows how to align your push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 urllib3

      - name: Run Scraper
        run: python global.py 

      - name: Save JSON to Repo
        shell: bash # 🪛 CRITICAL FIX: Forces Windows to interpret Bash logic for your commands
        run: |
          git config --global user.name "OnePlus-Bot"
          git config --global user.email "bot@yourdomain.com"
          
          git add oneplus_ota_final.json
          
          # Git commits cleanly; if nothing changed, it exits safely with 0
          git commit -m "Auto-update OTA JSON" || exit 0
          
          # Explicit upstream target mapping ensures a successful push to main
          git push origin HEAD:main
